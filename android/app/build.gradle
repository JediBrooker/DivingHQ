apply plugin: 'com.android.application'

// Keep upload credentials outside source control, following Android's signing
// properties pattern: https://developer.android.com/studio/publish/app-signing
def signingPropertiesPath = System.getenv('DIVINGHQ_ANDROID_SIGNING_PROPERTIES')
def uploadSigning = new Properties()
def repositoryRoot = rootProject.projectDir.parentFile.canonicalPath + File.separator
if (signingPropertiesPath) {
    def signingPropertiesFile = new File(signingPropertiesPath)
    if (!signingPropertiesFile.isAbsolute() || !signingPropertiesFile.isFile()
        || signingPropertiesFile.canonicalPath.startsWith(repositoryRoot)) {
        throw new GradleException('DIVINGHQ_ANDROID_SIGNING_PROPERTIES must name an existing absolute file outside the repository')
    }
    signingPropertiesFile.withInputStream { uploadSigning.load(it) }
    for (def key : ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']) {
        if (!uploadSigning[key]) throw new GradleException("Missing upload signing property: ${key}")
    }
    def uploadStoreFile = new File(uploadSigning['storeFile'])
    if (!uploadStoreFile.isAbsolute() || !uploadStoreFile.isFile()
        || uploadStoreFile.canonicalPath.startsWith(repositoryRoot)) {
        throw new GradleException('Upload storeFile must name an existing absolute file outside the repository')
    }
}

android {
    namespace = "app.divinghq.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.divinghq.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingPropertiesPath) {
            upload {
                storeFile file(uploadSigning['storeFile'])
                storePassword uploadSigning['storePassword']
                keyAlias uploadSigning['keyAlias']
                keyPassword uploadSigning['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingPropertiesPath) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Refuse a misleading unsigned release artifact; Debug stays usable without keys.
tasks.configureEach {
    if (name == 'preReleaseBuild') {
        doFirst {
            if (!signingPropertiesPath) {
                throw new GradleException('Set DIVINGHQ_ANDROID_SIGNING_PROPERTIES before building a release')
            }
            def configFile = file('google-services.json')
            if (!configFile.isFile()) throw new GradleException('Release requires the DivingHQ Firebase google-services.json in android/app')
            def firebaseConfig
            try { firebaseConfig = new groovy.json.JsonSlurper().parse(configFile) }
            catch (Exception ignored) { throw new GradleException('Invalid Firebase Android configuration') }
            def matchingClient = firebaseConfig.client?.find { it.client_info?.android_client_info?.package_name == 'app.divinghq.mobile' }
            if (!firebaseConfig.project_info?.project_id || !firebaseConfig.project_info?.project_number
                || !matchingClient?.client_info?.mobilesdk_app_id?.startsWith('1:' + firebaseConfig.project_info.project_number + ':android:')
                || !matchingClient?.api_key?.any { it.current_key }) {
                throw new GradleException('Firebase configuration must contain the DivingHQ app.divinghq.mobile Android client and project')
            }

        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Same SDK as the Capacitor push plugin; app bridge awaits deleteToken's Task.
    implementation "com.google.firebase:firebase-messaging:${rootProject.ext.has('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'}"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
