<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6191">
  <!-- iOS Safari PWA tags. The manifest.webmanifest declares
       display: standalone, but iOS Safari ignores the manifest
       for "Add to Home Screen" — it needs these apple-mobile-
       web-app-* meta tags instead. Without them, an installed
       PWA opens in Safari WITH the URL bar visible, breaking
       the standalone illusion (and stealing ~80px of vertical
       space, which matters poolside on a small phone).
       black-translucent + viewport-fit=cover lets the page
       draw under the notch / status bar so the safe-area-inset
       env() values become non-zero and the design's notch-aware
       paddings actually apply. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DivingHQ">
  <title>DivingHQ · Diving competition software for clubs and federations</title>
  <!-- Search and link-preview tags. This file is the shell for every SPA
       route, so these describe the product as a whole. The router sets a
       per-page document.title after boot, and the server rewrites the
       canonical and og:url to the path actually requested, plus the
       origin to APP_BASE_URL (lib/spa-shell.js). Keep the attribute order
       as written, the rewrite matches on it. -->
  <meta name="description" content="Diving competition software for clubs, states and federations: dive lists, live judging on phones, a public scoreboard and results. Clubs can start today, no federation needed.">
  <link rel="canonical" href="https://divinghq.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DivingHQ">
  <meta property="og:title" content="DivingHQ · Diving competition software for clubs and federations">
  <meta property="og:description" content="Dive lists, live judging on phones, a public scoreboard and results. Clubs can start today, no federation needed.">
  <meta property="og:url" content="https://divinghq.app/">
  <meta property="og:image" content="https://divinghq.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="DivingHQ: diving competition software for clubs, states and federations">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DivingHQ · Diving competition software for clubs and federations">
  <meta name="twitter:description" content="Dive lists, live judging on phones, a public scoreboard and results. Clubs can start today, no federation needed.">
  <meta name="twitter:image" content="https://divinghq.app/og-image.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
  <!-- Fonts. preconnect lets the HTML parser kick off DNS + TLS
       to fonts.googleapis.com + fonts.gstatic.com in parallel
       with the main JS/CSS bundle download. The stylesheet link
       itself is render-blocking by default, but display=swap on
       the font URL means the design still paints (with a system
       fallback) immediately and swaps to IBM Plex Sans / DM Mono
       when they're ready. Previously this was an @import at the
       top of app.css, which blocks first paint while the CSSOM
       waits for the round-trip, a measurable papercut on slow
       poolside cell connections. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
  <!-- Global stylesheet is imported by src/main.js so Vite
       content-hashes the bundled filename. -->
  <!-- Apply the saved theme before first paint so there's no
       flash of the wrong theme. Kept in an external file (not an
       inline <script>) so the strict script-src 'self' CSP needs no
       hash or nonce — see the CSP note in server.js. The Pinia UI
       store (src/stores/ui.js) reads the same localStorage key and
       keeps this in sync at runtime. -->
  <script src="/theme-init.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
