name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manually trigger a snapshot regeneration on CI. Required because
  # Playwright visual baselines are platform-pinned to chromium-linux
  # and can't be produced on macOS dev machines. Run the workflow with
  # update_snapshots=true, download the `updated-snapshots` artifact,
  # then commit the PNGs to the repo.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate Playwright visual baselines'
        type: boolean
        default: false

jobs:
  build:
    name: Build SPA + lint server
    runs-on: ubuntu-latest

    env:
      # Outbox feature flag is a build-time Vite constant. Setting
      # it here bakes outbox=on into the CI bundle so the e2e job
      # downstream exercises the same code path the canary
      # federation will hit in production. Production .env keeps
      # this at 0 until canary signs off. See
      # docs/offline-p1-design.md §5.
      VITE_OFFLINE_OUTBOX_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cache node_modules (including compiled native deps: bcrypt,
      # sharp, esbuild) keyed on the lockfile. On a hit we skip npm ci
      # entirely; the runner OS is constant so the cached binaries are
      # safe to reuse. Shared across the build/test/e2e jobs.
      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint (server syntax + frontend ESLint)
        run: npm run lint

      - name: Build SPA
        run: npm run build

      - name: Bundle-size budget
        run: npm run check:size

      - name: Reduced-motion guard
        run: npm run check:motion

      # Hand the built SPA to the e2e job so it doesn't rebuild from
      # scratch on the critical path. See the e2e job's download step
      # and PW_SKIP_BUILD in playwright.config.js.
      - name: Upload SPA build
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: dist/
          retention-days: 1

  test:
    name: Tests against Postgres
    runs-on: ubuntu-latest
    # No dependency on `build`: these are Node API/unit tests that never
    # touch the SPA bundle, so they run in parallel with the build job
    # instead of waiting behind it.

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: diver
          POSTGRES_PASSWORD: diver
          POSTGRES_DB: divinghq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: diver
      PGPASSWORD: diver
      PGDATABASE: divinghq_test
      # JWT_SECRET is required for server.js to boot (it fail-closes
      # on missing or placeholder values). The integration test
      # require()s server.js directly, so without this the whole
      # test run dies at startup. Use a long deterministic dummy —
      # CI never sees real user data.
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-aaaaaaaaaaaaaaaa
      # Defer the english-stuck subtest in test/i18n-parity.test.js
      # to the deploy-time background translator (section 8 of
      # deploy.sh). CI's job is to catch runtime-breaking issues
      # (missing keys, extra keys, placeholder mismatches — those
      # three subtests still run); UX-quality "is this string
      # actually translated yet" is the translator's job. Same
      # flag deploy.sh sets when running test:safe.
      SKIP_I18N_STUCK_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Apply schema (init.sql)
        run: psql -v ON_ERROR_STOP=1 -h localhost -U diver -d divinghq_test -f init.sql

      # init.sql is pinned at v53; apply the tail migrations so the
      # integration specs run against the same schema the server uses
      # (idempotency_keys, actor_local_time, score_source, …) instead of
      # self-skipping. (The manual-scores integration suite is skipped
      # in-file pending a fixture rewrite — its fixture predates the
      # user_org_roles migration.)
      - name: Apply tail migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://diver:diver@localhost:5432/divinghq_test

      - name: Run tests
        run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: diver
          POSTGRES_PASSWORD: diver
          POSTGRES_DB: divinghq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # libpq vars — pg's Pool falls back to these when the DB_*
      # alternatives aren't set. Same shape the test job uses.
      PGHOST: localhost
      PGUSER: diver
      PGPASSWORD: diver
      PGDATABASE: divinghq_test
      # Match the build job so the webServer (which runs
      # `npm run build && node server.js`) bakes the outbox flag
      # into the bundle Playwright actually drives.
      VITE_OFFLINE_OUTBOX_ENABLED: "1"
      # DB_DATABASE explicit so the integration-test fixture
      # (which prefers DB_* over PG*) targets the same database.
      DB_DATABASE: divinghq_test
      # Required for server.js to boot — see the test job's
      # comment for why we use a long deterministic dummy.
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-aaaaaaaaaaaaaaaa
      # Bind the test webServer to a non-default port so it can
      # never collide with anything else the runner happens to
      # have on :3000.
      PORT: "3097"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Pull in the SPA bundle built by the `build` job so the
      # Playwright webServer can boot `node server.js` directly
      # (PW_SKIP_BUILD below) instead of rebuilding it here.
      - name: Download SPA build
        uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: dist/

      - name: Apply schema (init.sql)
        run: psql -v ON_ERROR_STOP=1 -h localhost -U diver -d divinghq_test -f init.sql

      # init.sql is a snapshot pinned at schema v53; apply the tail
      # migrations (054+) so the DB matches what server.js expects
      # (idempotency_keys, actor_local_time, score_source, …). Without
      # this the meet-time write endpoints 500 and the diver / coach /
      # scoring e2e specs fail.
      - name: Apply tail migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://diver:diver@localhost:5432/divinghq_test

      # Cache the Playwright browser binaries (chromium + firefox +
      # webkit) keyed by the lockfile plus a browser-set marker. Bump
      # the "-cfw" suffix whenever the installed browser set changes,
      # so a stale cache can't shadow newly-added browsers (the bug
      # that left firefox/webkit missing when only chromium was cached).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-cfw

      # First run: download all three browsers AND their system deps.
      # No browser argument installs chromium + firefox + webkit, which
      # matches the projects in playwright.config.js (chromium,
      # mobile-chrome, firefox, mobile-safari/webkit). Cached run: the
      # binaries are restored from ~/.cache; only the apt system deps
      # (which live outside that path) need reinstalling each time.
      - name: Install Playwright (browsers + deps, fresh)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      # playwright.config.js boots the app via webServer — no separate
      # "start the app" step. With PW_SKIP_BUILD set it runs
      # `node server.js` against the downloaded dist/ instead of
      # rebuilding. process.env.CI flips the config to retries=2 +
      # GitHub reporter + 3 workers.
      # On pull requests, gate with chromium only — the cross-browser /
      # mobile projects (firefox, mobile-chrome, mobile-safari) rarely
      # catch PR-specific regressions and roughly quadruple e2e time.
      # Pushes to main and manual dispatches run the full project matrix.
      - name: Run e2e (chromium only — pull request)
        if: github.event.inputs.update_snapshots != 'true' && github.event_name == 'pull_request'
        run: npm run test:e2e -- --project=chromium
        env:
          PW_SKIP_BUILD: "1"
          # Browser specs are render/network-bound, so oversubscribing
          # the runner's cores shortens wall-clock. playwright.config.js
          # reads PW_WORKERS (default 3).
          PW_WORKERS: "4"

      - name: Run e2e (full browser matrix)
        if: github.event.inputs.update_snapshots != 'true' && github.event_name != 'pull_request'
        run: npm run test:e2e
        env:
          PW_SKIP_BUILD: "1"
          PW_WORKERS: "4"

      # When dispatched with update_snapshots=true, run Playwright
      # with --update-snapshots so visual-regression baselines get
      # (re)generated against this exact runner image. The artifact
      # below uploads the result for download + commit.
      - name: Run e2e (regenerate visual snapshots)
        if: github.event.inputs.update_snapshots == 'true'
        run: npx playwright test --update-snapshots

      # Failure artifacts — when an e2e flakes or breaks, this
      # uploads the trace + screenshots + video so we can
      # diagnose without re-running locally.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload regenerated snapshots
        if: github.event.inputs.update_snapshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: test/e2e/**/*-snapshots/
          retention-days: 7
          if-no-files-found: error
